<!doctype html>
<!--
  index.html — Punto de entrada de la PWA "Reporte de traslado".
  Solo contiene el esqueleto: encabezado, contenedor de vistas y barra inferior.
  Todo lo demás se dibuja desde src/main.js (JavaScript modular, sin build).
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2c6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Reporte de traslado</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/componentes.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <img src="assets/img/logo-132sem.jpg" alt="132 SEM" class="app-logo">
      <div class="app-titulo">
        <strong>Reporte de traslado</strong>
        <span id="app-subtitulo">Sin caso abierto</span>
      </div>
    </header>
    <main id="vista"></main>
    <nav class="nav-inferior" id="nav"></nav>
  </div>
  <div id="modal-root"></div>

  <!-- jsPDF se guarda localmente para que el PDF funcione sin conexión -->
  <script src="assets/vendor/jspdf.umd.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
